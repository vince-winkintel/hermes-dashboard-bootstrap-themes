name: bootstrap-v5-dark
label: Bootstrap v5 Dark
source: "Bootswatch Slate v5.3.8 inspired by https://bootswatch.com/slate/"
description: Bootswatch Slate-inspired dark theme for the Hermes dashboard; dark graphite surfaces, white links, soft gray body text, and classic Slate component contrast

palette:
  background: "#272b30"
  midground: "#aaaaaa"
  foreground: "#ffffff"
  warmGlow: "rgba(91, 192, 222, 0.12)"
  noiseOpacity: 0.045

typography:
  fontSans: 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", "Liberation Sans", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"'
  fontMono: 'SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace'
  fontDisplay: 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", "Liberation Sans", Arial, sans-serif'
  fontUrl: ""
  baseSize: "16px"
  lineHeight: "1.5"
  letterSpacing: "0"

layout:
  radius: "0.375rem"
  density: comfortable

layoutVariant: standard

assets:
  bg: "none"

colorOverrides:
  card: "#32383e"
  cardForeground: "#aaaaaa"
  popover: "#32383e"
  popoverForeground: "#aaaaaa"
  primary: "#3a3f44"
  primaryForeground: "#ffffff"
  secondary: "#7a8288"
  secondaryForeground: "#ffffff"
  muted: "#3a3f44"
  mutedForeground: "#aaaaaa"
  accent: "#5bc0de"
  accentForeground: "#ffffff"
  destructive: "#ee5f5b"
  destructiveForeground: "#ffffff"
  success: "#62c462"
  warning: "#f89406"
  border: "#000000"
  input: "#ffffff"
  ring: "#5bc0de"

componentStyles:
  card:
    background: "#32383e"
    boxShadow: "inset 0 1px 0 rgba(255,255,255,.08), 0 .5rem 1rem rgba(0,0,0,.22)"
    borderRadius: "0.375rem"
  header:
    background: "linear-gradient(#3a3f44, #272b30 60%, #202328)"
    boxShadow: "0 1px 0 rgba(255,255,255,.08), 0 1px 3px rgba(0,0,0,.45)"
  footer:
    background: "#272b30"
  tab:
    borderRadius: "0.375rem 0.375rem 0 0"
  badge:
    borderRadius: "0.25rem"
  progress:
    borderRadius: "0.375rem"
  backdrop:
    background: "radial-gradient(circle at 20% 0%, rgba(91, 192, 222, 0.10), transparent 36%), linear-gradient(180deg, #32383e 0%, #272b30 28%, #202328 100%)"

customCSS: |
  :root {
    color-scheme: dark;
    /* Bootswatch Slate v5.3.8 tokens. Source: https://bootswatch.com/slate/ */
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", "Liberation Sans", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
    --font-mono: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    --font-rules-compressed: var(--font-sans);
    --font-rules-expanded: var(--font-sans);
    --font-mondwest: var(--font-sans);

    --bs-blue: #007bff; --bs-indigo: #6610f2; --bs-purple: #6f42c1; --bs-pink: #e83e8c;
    --bs-red: #ee5f5b; --bs-orange: #fd7e14; --bs-yellow: #f89406; --bs-green: #62c462;
    --bs-teal: #20c997; --bs-cyan: #5bc0de; --bs-black: #000; --bs-white: #fff;
    --bs-gray: #7a8288; --bs-gray-dark: #3a3f44; --bs-gray-100: #f8f9fa; --bs-gray-200: #e9ecef;
    --bs-gray-300: #dee2e6; --bs-gray-400: #ced4da; --bs-gray-500: #999; --bs-gray-600: #7a8288;
    --bs-gray-700: #52575c; --bs-gray-800: #3a3f44; --bs-gray-900: #272b30;

    --bs-primary: #3a3f44; --bs-secondary: #7a8288; --bs-success: #62c462; --bs-info: #5bc0de;
    --bs-warning: #f89406; --bs-danger: #ee5f5b; --bs-light: #e9ecef; --bs-dark: #272b30;
    --bs-primary-rgb: 58, 63, 68; --bs-secondary-rgb: 122, 130, 136; --bs-success-rgb: 98, 196, 98;
    --bs-info-rgb: 91, 192, 222; --bs-warning-rgb: 248, 148, 6; --bs-danger-rgb: 238, 95, 91;
    --bs-light-rgb: 233, 236, 239; --bs-dark-rgb: 39, 43, 48;

    --bs-font-sans-serif: var(--font-sans); --bs-font-monospace: var(--font-mono);
    --bs-body-font-family: var(--bs-font-sans-serif); --bs-body-font-size: 1rem; --bs-body-font-weight: 400;
    --bs-body-line-height: 1.5; --bs-body-color: #aaa; --bs-body-color-rgb: 170, 170, 170;
    --bs-body-bg: #272b30; --bs-body-bg-rgb: 39, 43, 48; --bs-emphasis-color: #fff; --bs-emphasis-color-rgb: 255, 255, 255;
    --bs-secondary-color: rgba(170, 170, 170, 0.75); --bs-secondary-bg: #3a3f44; --bs-secondary-bg-rgb: 58, 63, 68;
    --bs-tertiary-color: rgba(170, 170, 170, 0.5); --bs-tertiary-bg: #32383e; --bs-tertiary-bg-rgb: 50, 56, 62;
    --bs-heading-color: #fff; --bs-border-color: rgba(0, 0, 0, 0.6); --bs-border-color-translucent: rgba(0, 0, 0, 0.6);
    --bs-border-radius: 0.375rem; --bs-link-color: #fff; --bs-link-hover-color: #ccc; --bs-code-color: #e83e8c;
  }

  html, body, #root {
    background: var(--bs-body-bg);
    color: var(--bs-body-color);
    font-family: var(--font-sans);
    line-height: var(--bs-body-line-height);
  }

  body, button, input, textarea, select {
    font-family: var(--font-sans);
    text-transform: none;
  }

  code, pre, kbd, samp {
    font-family: var(--font-mono);
    text-transform: none;
  }

  a { color: var(--bs-link-color); text-decoration: underline; text-decoration-thickness: 0.08em; text-underline-offset: 0.18em; }
  a:hover { color: var(--bs-link-hover-color); }

  [data-layout-variant="standard"] { text-transform: none; }

  aside, nav, header, footer,
  aside a, nav a,
  button,
  [role="tab"], [role="menuitem"], [role="option"],
  .uppercase {
    letter-spacing: .015em;
  }

  h1, h2, h3, h4, h5, h6,
  .font-expanded, .font-compressed {
    color: var(--bs-heading-color);
  }

  input, textarea, select {
    background-color: #fff;
    color: #272b30;
    border: 1px solid rgba(0, 0, 0, 0.6);
    border-radius: var(--bs-border-radius);
    box-shadow: inset 0 1px 1px rgba(0,0,0,.075);
  }

  input::placeholder, textarea::placeholder {
    color: #52575c;
    opacity: 1;
  }

  /* Config uses custom combobox buttons for select fields. Match Bootswatch
     Slate's .form-select treatment so they align with text inputs. */
  button[role="combobox"][class*="bg-background/40"] {
    font-family: var(--bs-body-font-family) !important;
    font-size: 1rem;
    font-weight: 400;
    line-height: 1.5;
    color: #272b30 !important;
    background-color: #ffffff !important;
    background-image: none !important;
    border: 1px solid rgba(0, 0, 0, 0.6) !important;
    border-radius: var(--bs-border-radius);
    box-shadow: inset 0 1px 1px rgba(0,0,0,.075) !important;
    text-shadow: none !important;
  }

  button[role="combobox"][class*="bg-background/40"] svg {
    color: #3a3f44 !important;
    opacity: 1;
  }

  button[role="combobox"][class*="bg-background/40"]:focus-visible {
    border-color: #5bc0de !important;
    box-shadow: inset 0 1px 1px rgba(0,0,0,.075), 0 0 0 .25rem rgba(var(--bs-info-rgb), .25) !important;
  }

  [role="listbox"][class*="bg-background-base"] {
    color: #272b30 !important;
    background-color: #ffffff !important;
    border: 1px solid rgba(0, 0, 0, 0.6) !important;
    border-radius: var(--bs-border-radius);
    box-shadow: 0 .5rem 1rem rgba(0,0,0,.35) !important;
  }

  [role="listbox"][class*="bg-background-base"] [role="option"] {
    font-family: var(--bs-body-font-family) !important;
    color: #272b30 !important;
    background: transparent !important;
    text-shadow: none;
  }

  [role="listbox"][class*="bg-background-base"] [role="option"]:hover,
  [role="listbox"][class*="bg-background-base"] [role="option"][aria-selected="true"] {
    color: #ffffff !important;
    background: #3a3f44 !important;
  }

  [role="listbox"][aria-label="Theme"] {
    background: #ffffff !important;
    color: #272b30 !important;
    border-color: rgba(0,0,0,.6) !important;
  }

  [role="listbox"][aria-label="Theme"] > div:first-child > span:first-child {
    color: #212529 !important;
    font-family: var(--bs-body-font-family) !important;
    font-size: .75rem !important;
    font-weight: 700 !important;
    letter-spacing: .08em !important;
  }

  [role="listbox"][aria-label="Theme"] span[class*="text-midground/50"] {
    color: #5c636a !important;
  }

  [role="listbox"][aria-label="Theme"] [role="option"][aria-selected="true"] span[class*="text-midground/50"] {
    color: #dee2e6 !important;
  }

  .text-muted-foreground {
    color: var(--bs-secondary-color) !important;
  }

  /* Hermes v0.16+ sidebar/system metadata uses low-opacity utility classes
     for section labels, gateway status rows, and the footer version. Keep
     those tiny labels AA-readable against the Slate sidebar background. */
  aside span[class*="uppercase"],
  aside span[class*="opacity-30"],
  aside span[class*="opacity-40"],
  aside span[class*="opacity-50"],
  aside span[class*="opacity-60"],
  aside span[class*="opacity-65"],
  aside span[class*="opacity-70"],
  aside span[class*="opacity-80"],
  aside [class*="text-text-secondary"],
  aside [class*="text-text-tertiary"],
  aside [class*="text-midground/50"],
  aside [class*="text-midground/60"],
  aside [class*="text-midground/65"],
  aside [class*="text-midground/70"],
  aside [class*="text-midground/75"],
  aside [class*="text-midground/80"],
  aside [class*="text-muted-foreground/50"],
  aside [class*="text-muted-foreground/60"],
  aside [class*="text-muted-foreground/65"],
  aside [class*="text-muted-foreground/70"] {
    color: #ced4da !important;
    opacity: 1 !important;
  }

  main span[class*="text-text-secondary"],
  main span[class*="text-text-tertiary"],
  main label[class*="text-text-secondary"],
  main label[class*="text-text-tertiary"] {
    color: #ced4da !important;
    opacity: 1 !important;
  }

  /* Toggle switches: keep the off state subdued, but make checked/on states
     visibly success-green so they are easy to distinguish in Config. */
  [role="switch"] {
    border-radius: 999rem;
  }

  [role="switch"] > span {
    border-radius: 999rem;
  }

  [role="switch"][aria-checked="true"] {
    background: linear-gradient(#7dd87d, #62c462 60%, #4e9d4e) !important;
    border-color: #4e9d4e !important;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 0 0 1px rgba(98,196,98,.18), 0 1px 2px rgba(0,0,0,.35) !important;
  }

  [role="switch"][aria-checked="true"] > span {
    background: #ffffff !important;
    box-shadow: 0 1px 2px rgba(0,0,0,.4) !important;
  }

  [role="switch"][aria-checked="true"]:focus-visible {
    box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 0 0 .25rem rgba(var(--bs-success-rgb), .25) !important;
  }

  .border-border {
    border-color: var(--bs-border-color) !important;
  }

  .bg-card\/80, .bg-card {
    background-color: #32383e !important;
  }

  button, [role="button"] {
    border-radius: var(--bs-border-radius);
  }

  button:not(:disabled), [role="button"]:not(:disabled) {
    text-shadow: 0 -1px 0 rgba(0,0,0,.25);
  }

  button:not(:disabled):not([aria-label="Delete session"]),
  [role="button"]:not(:disabled) {
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 1px 2px rgba(0,0,0,.35);
  }

  /* Filled action buttons such as Profiles > + Create/Save should use Bootstrap/Slate
     button typography instead of the dashboard's terminal-style mono caps. */
  button[class*="font-mono"][class*="bg-midground"][class*="text-background-base"] {
    font-family: var(--bs-body-font-family) !important;
    font-size: .875rem;
    font-weight: 400 !important;
    line-height: 1.25;
    letter-spacing: 0 !important;
    text-transform: none !important;
    color: #ffffff !important;
    background: linear-gradient(#4f565d, #3a3f44 60%, #31363a) !important;
    border: 1px solid #272b30;
    text-shadow: 0 -1px 0 rgba(0,0,0,.35);
  }

  button[class*="font-mono"][class*="bg-midground"][class*="text-background-base"][class*="leading-0"] {
    padding: 1.25em .9em !important;
  }

  button[class*="font-mono"][class*="bg-midground"][class*="text-background-base"][class*="text-[0.7rem]"] {
    padding: .375rem .75rem !important;
    line-height: 1.5;
  }

  /* Plugin action buttons can combine a dark translucent background with
     text-background-base, which makes labels nearly invisible in Slate. */
  button[class*="bg-background/40"][class*="text-background-base"]:not([role="combobox"]) {
    font-family: var(--bs-body-font-family) !important;
    font-weight: 400 !important;
    letter-spacing: 0 !important;
    text-transform: none !important;
    color: #ffffff !important;
    background: linear-gradient(#4f565d, #3a3f44 60%, #31363a) !important;
    border: 1px solid #272b30 !important;
    text-shadow: 0 -1px 0 rgba(0,0,0,.35) !important;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 1px 2px rgba(0,0,0,.35) !important;
  }

  button[class*="bg-background/40"][class*="text-background-base"]:not([role="combobox"]):hover {
    color: #ffffff !important;
    background: linear-gradient(#5a626a, #444b52 60%, #363c42) !important;
  }

  button[class*="bg-background/40"][class*="text-background-base"]:not([role="combobox"]):disabled,
  button[class*="bg-background/40"][class*="text-background-base"]:not([role="combobox"])[aria-disabled="true"] {
    color: #adb5bd !important;
    background: #2b3035 !important;
    border-color: #495057 !important;
    box-shadow: none !important;
    text-shadow: none !important;
  }

  /* Secondary inline actions such as Profiles edit-mode Cancel read better as
     Slate link buttons than as tiny terminal buttons. */
  button[class*="font-mono"][class*="bg-transparent"][class*="text-current"][class*="text-[0.7rem]"] {
    font-family: var(--bs-body-font-family) !important;
    font-size: .875rem;
    font-weight: 400 !important;
    line-height: 1.5;
    letter-spacing: 0 !important;
    text-transform: none !important;
    color: var(--bs-link-color) !important;
    background: transparent !important;
    border: 1px solid transparent !important;
    box-shadow: none !important;
    padding: .375rem .75rem !important;
    text-decoration: underline;
    text-underline-offset: .18em;
    text-shadow: none;
  }

  :focus-visible {
    outline: 0;
    box-shadow: 0 0 0 .25rem rgba(var(--bs-info-rgb), .35) !important;
  }

  ::selection {
    color: #fff;
    background: rgba(var(--bs-info-rgb), .35);
  }

  table, [role="grid"], pre {
    font-variant-numeric: tabular-nums;
  }

  pre {
    color: var(--bs-body-color);
    background: #202328;
    border: 1px solid var(--bs-border-color);
    border-radius: var(--bs-border-radius);
  }

  code {
    color: var(--bs-code-color);
  }

  /* Expanded session transcripts render fenced JSON inside <pre><code>.
     Neutralize bright inline-code backgrounds there and keep code blocks Slate-dark. */
  pre > code,
  pre code:not(.font-courier) {
    display: block;
    color: #f8f9fa !important;
    font-size: 10px !important;
    line-height: 1.5;
    background: transparent !important;
    border: 0 !important;
    box-shadow: none !important;
    padding: 0 !important;
    text-shadow: none;
  }

  pre code *,
  pre .hljs,
  pre .token {
    background: transparent !important;
  }

  pre .token.property,
  pre .token.string,
  pre .hljs-attr,
  pre .hljs-string {
    color: #f0a8cc !important;
  }

  pre .token.number,
  pre .hljs-number {
    color: #ffffff !important;
  }

  :not(pre) > code,
  code.font-courier {
    color: #f0a8cc;
    background: #202328;
    border: 1px solid rgba(255,255,255,.14);
    border-radius: .25rem;
    padding: .125rem .35rem;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 1px 1px rgba(0,0,0,.25);
    font-size: .75rem;
    text-shadow: none;
  }

  /* Models page token progress bars: match Bootswatch Slate's recessed track,
     pill geometry, and contextual progress colors. */
  div[class*="h-2"][class*="w-full"][class*="overflow-hidden"][class*="bg-muted/30"] {
    height: .625rem !important;
    background-color: #1c1e22 !important;
    border-radius: 999rem !important;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.65), 0 1px 0 rgba(255,255,255,.04);
  }

  div[class*="h-2"][class*="w-full"][class*="overflow-hidden"][class*="bg-muted/30"] > div {
    border-radius: 0;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
  }

  div[class*="h-2"][class*="w-full"][class*="overflow-hidden"][class*="bg-muted/30"] > div:first-child {
    border-top-left-radius: 999rem;
    border-bottom-left-radius: 999rem;
  }

  div[class*="h-2"][class*="w-full"][class*="overflow-hidden"][class*="bg-muted/30"] > div:last-child {
    border-top-right-radius: 999rem;
    border-bottom-right-radius: 999rem;
  }

  div[class*="bg-blue-400/60"] { background-color: #5bc0de !important; }
  div[class*="bg-purple-400/60"] { background-color: #7a8288 !important; }
  div[class*="bg-[#ffe6cb]/70"] { background-color: #f89406 !important; }
  div[class*="bg-emerald-500/70"] { background-color: #62c462 !important; }

  span[class*="bg-blue-400/60"] { background-color: #5bc0de !important; }
  span[class*="bg-purple-400/60"] { background-color: #7a8288 !important; }
  span[class*="bg-[#ffe6cb]/70"] { background-color: #f89406 !important; }
  span[class*="bg-emerald-500/70"] { background-color: #62c462 !important; }

  /* Capability chips on the Models page need extra contrast in Slate.
     Tailwind's default dark text colors are too dim at the dashboard's 10px chip size. */
  span[class*="bg-emerald-500/10"][class*="text-emerald"],
  span[class*="bg-blue-500/10"][class*="text-blue"],
  span[class*="bg-purple-500/10"][class*="text-purple"] {
    color: #f8f9fa !important;
    background: linear-gradient(#3a3f44, #272b30 85%) !important;
    border: 1px solid rgba(255,255,255,.16);
    border-radius: .25rem;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.10), 0 1px 2px rgba(0,0,0,.35);
    font-size: .6875rem;
    line-height: 1.25;
    text-shadow: 0 -1px 0 rgba(0,0,0,.45);
  }

  span[class*="bg-emerald-500/10"][class*="text-emerald"] {
    border-color: rgba(98,196,98,.55);
    background: linear-gradient(180deg, rgba(98,196,98,.24), rgba(39,43,48,.95)) !important;
  }

  span[class*="bg-blue-500/10"][class*="text-blue"] {
    border-color: rgba(91,192,222,.55);
    background: linear-gradient(180deg, rgba(91,192,222,.24), rgba(39,43,48,.95)) !important;
  }

  span[class*="bg-purple-500/10"][class*="text-purple"] {
    border-color: rgba(176,139,255,.55);
    background: linear-gradient(180deg, rgba(176,139,255,.24), rgba(39,43,48,.95)) !important;
  }

  span[class*="bg-emerald-500/10"][class*="text-emerald"] svg,
  span[class*="bg-blue-500/10"][class*="text-blue"] svg,
  span[class*="bg-purple-500/10"][class*="text-purple"] svg {
    color: currentColor !important;
    opacity: .95;
  }

  span[class*="bg-muted"][class*="text-muted-foreground"][class*="text-[10px]"] {
    color: #ced4da !important;
    background: #3a3f44 !important;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: .25rem;
    font-size: .6875rem;
    line-height: 1.25;
  }

  /* WCAG AA contrast pass for compact controls and plugin surfaces. Slate's
     stock near-black button borders disappear against dark cards; use the
     mid-gray Bootstrap border only where controls need a visible boundary. */
  button:not(:disabled),
  [role="button"]:not(:disabled),
  .hermes-kanban-docs-link,
  .hermes-kanban-column-add,
  .ha-pills button,
  .ha-share-trigger {
    border-color: #8c969e !important;
  }

  div[role="radiogroup"][class*="border-midground"] {
    border-color: #8c969e !important;
  }

  .text-destructive,
  [class*="text-destructive"] {
    color: #ff9999 !important;
  }

  .hermes-kanban-progress,
  .hermes-kanban-progress--full {
    color: #ffffff !important;
    text-shadow: 0 -1px 0 rgba(0,0,0,.45);
  }

  .ha-state-badge,
  .ha-tier-badge,
  .ha-criteria summary,
  .ha-tier-step {
    color: #ced4da !important;
  }

  .ha-tier-copper,
  .ha-state-badge:where([class*="copper"], [class*="discovered"]),
  .ha-tier-badge:where([class*="copper"], [class*="target"]) {
    color: #ffcc99 !important;
  }

  .ha-tier-olympian,
  .ha-state-badge:where([class*="olympian"]),
  .ha-tier-badge:where([class*="olympian"]) {
    color: #d8b4fe !important;
  }

  .ha-share-trigger {
    color: #ffffff !important;
    background: #3a3f44 !important;
    text-shadow: 0 -1px 0 rgba(0,0,0,.45) !important;
  }

  button[class*="text-background-base"]:not([role="combobox"]),
  button[class*="bg-background/40"][class*="text-background-base"]:not([role="combobox"]),
  button[class*="bg-midground"][class*="text-background-base"]:not([role="combobox"]) {
    border-color: #8c969e !important;
  }

  button[role="radio"][aria-checked="true"],
  div[role="radiogroup"] button[aria-checked="true"],
  div[role="radiogroup"] button[data-state="checked"],
  .sm\:sticky button[aria-pressed="true"],
